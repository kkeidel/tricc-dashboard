name: Render Rmd daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      SOSCI_API_KEY: ${{ secrets.SOSCI_API_KEY }}
      SOSCI_PROJECT_ID: ${{ secrets.SOSCI_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libcairo2-dev

      - name: Install packages
        run: |
          R -e "install.packages(c(
            'rmarkdown',
            'httr',
            'jsonlite',
            'dplyr',
            'tidyr',
            'knitr',
            'kableExtra',
            'crosstalk',
            'DT'
          ), repos='https://cloud.r-project.org')"

      - name: Render Rmd
        run: |
          R -e "rmarkdown::render('index.Rmd', output_file='index.html')"

      - name: Commit HTML
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'update html' || echo 'no changes'
          git push